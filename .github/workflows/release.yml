name: Release repository health package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected version tag to recover or publish.
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: repository-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release evidence
    if: ${{ github.repository == 'TedTschopp/github-repository-health' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}

    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Verify immutable release input
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Release source is not reachable from Main: $source_sha" >&2
            exit 2
          fi
          validation_conclusion="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$source_sha/check-runs?filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.name == "Validate repository" and .app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // ""'
          )"
          if [[ "$validation_conclusion" != 'success' ]]; then
            echo "Validate repository has not succeeded for release source $source_sha." >&2
            exit 2
          fi
          printf 'source-sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build revision-bound release evidence
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m automation.repository_health.release \
            --repository . \
            --revision "$SOURCE_SHA" \
            --tag "$RELEASE_TAG" \
            --source-repository "https://github.com/$GITHUB_REPOSITORY" \
            --output-directory release-dist
          (
            cd release-dist
            sha256sum -c SHA256SUMS
          )

      - name: Transfer release evidence to isolated publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist

      - name: Refuse an existing release or draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release or draft already exists for immutable tag $RELEASE_TAG; refusing to replace it." >&2
            exit 3
          fi

      - name: Attest source package and SBOM
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/github-repository-health-${{ env.RELEASE_TAG }}.tar.gz
          sbom-path: release-dist/github-repository-health-${{ env.RELEASE_TAG }}.spdx.json

      - name: Publish immutable GitHub Release
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="release-dist/github-repository-health-$RELEASE_TAG"
          archive="$prefix.tar.gz"
          sbom="$prefix.spdx.json"
          identity="$prefix.source.json"
          test -s "$archive"
          test -s "$sbom"
          test -s "$identity"
          test -s release-dist/SHA256SUMS
          test -s "$ATTESTATION_BUNDLE"
          test -n "$ATTESTATION_URL"
          (
            cd release-dist
            sha256sum -c SHA256SUMS
          )
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Provisional Git Repository Health Standard package `%s`.\n\n' "$RELEASE_TAG"
            printf -- '- Source revision: `%s`\n' "$SOURCE_SHA"
            printf -- '- Production correspondence: `Releasable-Main`\n'
            printf -- '- Artifact identity: SHA-256 digest in `SHA256SUMS`\n'
            printf -- '- GitHub artifact attestation: %s\n' "$ATTESTATION_URL"
            printf '\nThis remains a diagnostic draft, not a calibrated certification or release gate.\n'
          } > "$notes"
          gh release create "$RELEASE_TAG" \
            "$archive#Revision-bound source package" \
            "$sbom#SPDX 2.3 SBOM" \
            "$identity#Revision and artifact identity" \
            "release-dist/SHA256SUMS#SHA-256 digest manifest" \
            "$ATTESTATION_BUNDLE#GitHub artifact attestation bundle" \
            --latest=false \
            --notes-file "$notes" \
            --prerelease \
            --title "Git Repository Health Standard $RELEASE_TAG" \
            --verify-tag
