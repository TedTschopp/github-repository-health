name: Repository validation

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Bind evidence to the exact source tree
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          digest="$(git ls-tree -r --full-tree "${GITHUB_SHA:?}" | sha256sum | cut -d ' ' -f 1)"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Unable to calculate the exact source-tree digest" >&2
            exit 2
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Run repository validation suite
        id: tests
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

      - name: Check patch whitespace
        id: whitespace
        if: ${{ always() }}
        continue-on-error: true
        run: git diff --check HEAD

      - name: Exercise assessment and report contracts
        id: contract
        if: ${{ always() }}
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          report_directory="$RUNNER_TEMP/repository-health-contract"
          assessment_json="$report_directory/repository-health-assessment.json"
          mkdir -p "$report_directory"
          python3 -m automation.repository_health assess \
            --repository . \
            --catalog docs/control-catalog.md \
            --config .github/repository-health.toml \
            --output "$assessment_json"
          python3 -m automation.repository_health.reporting \
            --assessment "$assessment_json" \
            --output-dir "$report_directory"
          test -s "$assessment_json"
          test -s "$report_directory/health-assessment.md"
          test -s "$report_directory/leadership-summary.md"
          test -s "$report_directory/leadership-summary.json"

      - name: Classify the validation outcome
        id: validation
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail
          result=unknown
          if [[ "$TEST_OUTCOME" == success && "$WHITESPACE_OUTCOME" == success && "$CONTRACT_OUTCOME" == success ]]; then
            result=success
          elif [[ "$TEST_OUTCOME" == failure || "$WHITESPACE_OUTCOME" == failure || "$CONTRACT_OUTCOME" == failure ]]; then
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Package exact-run validation evidence
        if: ${{ always() }}
        uses: ./.github/actions/repository-health-evidence
        with:
          unit-id: github-repository-health
          kind: validation
          result: ${{ steps.validation.outputs.result || 'unknown' }}
          categories-json: '["repository-contract","test-suite","whitespace"]'
          subject-digests-json: >-
            [{"algorithm":"sha256","name":"git-ls-tree","value":"${{ steps.subject.outputs.sha256 }}"}]
          artifact-digests-json: '[]'
          source-evidence-ids-json: '["github-actions-run:${{ github.run_id }}:${{ github.run_attempt }}"]'
          output-directory: .repository-health-evidence/github-repository-health
          upload-artifact: 'true'
          retention-days: '90'

      - name: Restore the validation result
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATION_RESULT: ${{ steps.validation.outputs.result || 'unknown' }}
        run: |
          if [[ "$VALIDATION_RESULT" != success ]]; then
            echo "Repository validation result: $VALIDATION_RESULT" >&2
            exit 1
          fi
